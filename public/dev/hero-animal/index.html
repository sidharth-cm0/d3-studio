<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEV — Wolf Diagnostic Viewer | D3 Studio</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    background: #07090D; color: #E8EEEE;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  header { padding: 14px 20px; border-bottom: 1px solid #2A3449; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  h1 { font-size: 14px; font-weight: 700; letter-spacing: 0.08em; }
  .badge { background: #E31B48; color: #fff; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  #url { color: #9AA8BC; font-size: 11px; }
  #stage { flex: 1; position: relative; min-height: 55vh; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: absolute; top: 12px; left: 12px; right: 12px; pointer-events: none;
    font-size: 11px; line-height: 1.6; color: #9AA8BC; white-space: pre-wrap;
  }
  #hud b { color: #E8EEEE; }
  #hud .ok { color: #4ade80; }
  #hud .err { color: #ff7b72; font-weight: 700; }
  nav { display: flex; gap: 6px; padding: 10px 20px; flex-wrap: wrap; border-top: 1px solid #2A3449; }
  nav button {
    appearance: none; border: 1px solid #2A3449; background: #10141C; color: #E8EEEE;
    padding: 6px 14px; border-radius: 999px; font-size: 11px; cursor: pointer; font-family: inherit;
  }
  nav button:hover { border-color: #00D9FF; color: #00D9FF; }
  #log { padding: 10px 20px 16px; font-size: 11px; color: #9AA8BC; white-space: pre-wrap; max-height: 22vh; overflow-y: auto; }
</style>
</head>
<body>
<header>
  <h1>WOLF DIAGNOSTIC <span class="badge">DEV ONLY</span></h1>
  <span id="url">/assets/cinematic/quaternius-wolf.glb</span>
</header>
<div id="stage"><div id="hud">Loading GLTFLoader…</div></div>
<nav id="clips"></nav>
<div id="log"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'

const WOLF_URL = '/assets/cinematic/quaternius-wolf.glb' // EXACT production path
const hud = document.getElementById('hud')
const log = (m) => { const el = document.getElementById('log'); el.textContent += m + '\n'; el.scrollTop = el.scrollHeight }

const scene = new THREE.Scene()
scene.background = new THREE.Color(0x07090D)
scene.fog = new THREE.FogExp2(0x02060a, 0.055)

const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 80)
camera.position.set(1.6, 1.1, 3.2)

const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.PCFSoftShadowMap
document.getElementById('stage').appendChild(renderer.domElement)

const controls = new OrbitControls(camera, renderer.domElement)
controls.target.set(0, 0.75, 0)

// Neutral diagnostics lighting (mirrors production buildLights intensities)
scene.add(new THREE.AmbientLight(0x26303a, 0.35))
const rim = new THREE.DirectionalLight(0x82ddeb, 1.6); rim.position.set(-3.8, 4.4, 1.8); scene.add(rim)
const key = new THREE.DirectionalLight(0xffa45f, 2.0); key.position.set(3.2, 4.2, 2.4); scene.add(key)

// Floor + contact shadow
const floor = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.MeshStandardMaterial({ color: 0x080b0f, roughness: 0.5, metalness: 0.3 }))
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor)

// Bounding box helper container (filled after load)
let bboxHelper = null

const loader = new GLTFLoader()
const mixer = new THREE.AnimationMixer(scene)
const actions = {}
let activeAction = null

function playClip(name) {
  const next = actions[name]
  if (!next) { log(`clip not found: ${name}`); return }
  if (activeAction === next) return
  next.reset().fadeIn(0.35).play()
  if (activeAction) activeAction.fadeOut(0.35)
  activeAction = next
  log(`▶ ${name}`)
}

function resize() {
  const stage = document.getElementById('stage')
  const w = stage.clientWidth, h = stage.clientHeight
  camera.aspect = w / h; camera.updateProjectionMatrix()
  renderer.setSize(w, h)
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.65))
}
window.addEventListener('resize', resize)

loader.load(
  WOLF_URL,
  (gltf) => {
    const obj = gltf.scene
    const box = new THREE.Box3().setFromObject(obj)
    const size = box.getSize(new THREE.Vector3())
    const center = box.getCenter(new THREE.Vector3())

    // Normalize: ground the model, scale to ~1.3 units tall, face camera-left
    const scale = 1.3 / Math.max(size.y, size.z * 0.8, 0.001)
    obj.scale.setScalar(scale)
    obj.position.x -= center.x * scale
    obj.position.z -= center.z * scale
    obj.position.y -= box.min.y * scale
    obj.rotation.y = 0.18
    obj.updateMatrixWorld(true)

    obj.traverse((n) => {
      const m = n
      if (m.isMesh) { m.castShadow = true; m.receiveShadow = true }
    })

    scene.add(obj)
    log(`LOADED OK  size=[${size.x.toFixed(2)}, ${size.y.toFixed(2)}, ${size.z.toFixed(2)}] scale=${scale.toFixed(3)} pos-y=${obj.position.y.toFixed(3)}`)
    log(`clips (${gltf.animations.length}): ${gltf.animations.map(a => a.name).join(', ')}`)

    gltf.animations.forEach((clip) => {
      actions[clip.name] = mixer.clipAction(clip)
    })
    const nav = document.getElementById('clips')
    const preferred = ['Idle', 'Idle_2', 'Walk', 'Gallop', 'Attack', 'Eating']
    preferred.filter(n => actions[n]).forEach((name) => {
      const b = document.createElement('button')
      b.textContent = name
      b.addEventListener('click', () => playClip(name))
      nav.appendChild(b)
    })

    bboxHelper = new THREE.Box3Helper(new THREE.Box3().setFromObject(obj), 0x00D9FF)
    bboxHelper.visible = false
    scene.add(bboxHelper)

    const dims = `model dims (post-scale): x=${(size.x*scale).toFixed(2)} y=${(size.y*scale).toFixed(2)} z=${(size.z*scale).toFixed(2)}`
    hud.innerHTML = `<span class="ok">● LOADED</span>  ${WOLF_URL}\n<b>${dims}</b>\ntris≈1,962 · skin · ${gltf.animations.length} clips\n[B] toggles bounding box · drag to orbit`
    resize()
    playClip(actions['Idle'] ? 'Idle' : gltf.animations[0].name)
  },
  (ev) => { if (ev.total) log(`progress ${(ev.loaded / ev.total * 100).toFixed(0)}%`) },
  (err) => {
    console.error(err)
    hud.innerHTML = `<span class="err">● LOAD FAILED</span>\nURL: ${WOLF_URL}\nSee log below + browser console for the exact GLTFLoader error.`
    log('LOAD ERROR: ' + (err?.message || String(err)))
  }
)

window.addEventListener('keydown', (e) => {
  if (e.key === 'b' && bboxHelper) bboxHelper.visible = !bboxHelper.visible
})

const clock = new THREE.Clock()
renderer.setAnimationLoop(() => {
  mixer.update(clock.getDelta())
  controls.update()
  renderer.render(scene, camera)
})
resize()
</script>
</body>
</html>
